# نشر تلقائي للموقع — يبنى من Supabase (المقالات الجديدة من محرك الذكاء الاصطناعي)
# التفعيل: repository_dispatch (content-update) من محرك AI، أو يدوياً، أو كل 12 ساعة احتياطياً
name: Auto Deploy

on:
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:
    inputs:
      reason:
        description: 'سبب إعادة النشر'
        required: false
        default: 'manual'
  schedule:
    - cron: '30 */12 * * *'

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (Next.js + OpenNext + static HTML)
        run: npm run build:pages
        env:
          # مفتاح النشر مُتعمَّد نشره (يُشحن للمتصفح أصلاً) — قيم ثابتة بدل أسرار GitHub
          NEXT_PUBLIC_SUPABASE_URL: https://xtdrkziyndkvaxkxvfqx.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-MsvXS3OevPwi4bbRSyNJw_O29W7-1i
          NEXT_PUBLIC_APP_URL: https://iraqnow.pages.dev
          MEILISEARCH_HOST: https://ms-7fba9866c156-55153.par.meilisearch.io
          MEILISEARCH_SEARCH_KEY: 43adf2d3612dd385beb287cbb8bf065255f1ab0da6cb413cfd0c5bd8fb4c87e5

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy pages-deploy --project-name=iraqnow --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
